name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Icon lint
        run: |
          if [ -f tools/icons/lint.mjs ]; then node tools/icons/lint.mjs; else echo "no icon lint yet"; fi
      - name: Text rules
        run: npm run check:text
      - name: Build
        run: npm run build
      - name: Studio data is committed and up to date
        run: git diff --exit-code -- docs
      - name: Translations
        run: npm run check:i18n
      - name: Build glyphfox-angular
        run: npm run build:angular
      - name: Type declarations
        run: npm run typecheck
      - name: Tests
        run: npm test

  package:
    name: Package on Node 18 and 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Node 18 loads the package
        run: node scripts/smoke-package.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node 20 loads the package
        run: node scripts/smoke-package.mjs

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - name: Install Chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Install the system libraries of Chromium
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright-core install-deps chromium
      - name: Pages in five languages, on desktop and phone
        run: npm run e2e
